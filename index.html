<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>久時大富翁</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: 8x8 pixel board, perimeter = 28 tiles (20 real menu items), center = control panel; players + log stacked below. Single deliberate night-arcade look in the shop's navy. */
:root{
  --night:#141c33;
  --navy:#405880;
  --paper:#eef1f6;
  --paper-2:#dfe5ef;
  --ink:#0d1222;
  --sun:#ffd23f;
  --tomato:#ef5b4c;
  --muted:#9fb0cc;
  --px:"DotGothic16","PingFang TC","Noto Sans TC","Microsoft JhengHei",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--paper)}
body{font-family:var(--px);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px;
  -webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:8px 8px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font-family:var(--px);cursor:pointer}
button:focus-visible,.tile:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.btn{border:0;background:var(--sun);color:var(--ink);font-size:14px;padding:7px 12px;line-height:1.3;
  box-shadow:0 0 0 2px var(--ink),3px 3px 0 2px var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 2px var(--ink)}
.btn.alt{background:var(--paper)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:13px;padding:5px 10px}

/* board */
.board{position:relative;width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  gap:2px;padding:2px;background:var(--ink);box-shadow:0 0 0 3px var(--navy),6px 6px 0 3px #070a14}
.tile{position:relative;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;overflow:hidden;
  font-size:clamp(7.5px,2.1vw,12px);line-height:1.12;cursor:pointer;min-width:0;text-align:center}
.tile .band{width:100%;height:15%;flex:none}
.tile .nm{padding:1px 1px 0;white-space:nowrap;letter-spacing:-.03em}
.tile.en .nm{white-space:normal;font-size:.86em;line-height:1.02;letter-spacing:-.04em;overflow-wrap:anywhere}
.tile .pr{margin-top:auto;margin-bottom:6px;font-size:.9em;color:#4a5878;font-variant-numeric:tabular-nums}
.tile.corner{background:var(--paper-2);justify-content:center}
.tile.corner .pr{margin:0}
.tile.special{background:#f7ecc9;justify-content:center}
.tile .ic{font-size:1.45em;line-height:1.1}
.tile .own{position:absolute;left:0;right:0;bottom:0;height:5px}
.tile.owned{background:color-mix(in srgb,var(--oc) 42%,var(--paper));box-shadow:inset 0 0 0 3px var(--oc)}
.tile.owned .own{height:8px;background:var(--oc);box-shadow:0 -2px 0 var(--ink)}
.tile.owned .pr{color:var(--ink)}
.tile .lv{position:absolute;right:2px;top:18%;display:flex;flex-direction:column;gap:1px}
.tile .lv i{width:5px;height:5px;background:var(--ink);display:block}
.tile .toks{position:absolute;left:1px;right:1px;top:36%;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;pointer-events:none}
.tile .toks img{width:clamp(12px,3.3vw,20px);image-rendering:pixelated;filter:drop-shadow(1px 1px 0 var(--ink))}
.tile.hot{animation:blink .5s steps(2) 3}
@keyframes blink{50%{background:var(--sun)}}

.center{grid-row:2/8;grid-column:2/8;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(4px,1.6vw,12px);padding:6px;text-align:center;overflow:hidden;background:var(--night);
  background-image:radial-gradient(rgba(90,118,166,.25) 1px,transparent 1px);background-size:6px 6px}
.logo{font-size:clamp(18px,6vw,32px);letter-spacing:.06em;color:var(--sun);line-height:1;
  text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),3px 3px 0 var(--tomato)}
.logo small{display:block;font-size:.36em;color:var(--muted);letter-spacing:.2em;text-shadow:none;margin-top:5px}
.turn{display:flex;align-items:center;gap:6px;font-size:clamp(11px,3.2vw,15px)}
.turn img{width:20px;image-rendering:pixelated}
.dice{display:flex;gap:10px}
.die{width:clamp(30px,9vw,46px);aspect-ratio:1;background:var(--paper);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;
  box-shadow:0 0 0 2px var(--ink),3px 3px 0 2px var(--ink)}
.die i{background:var(--ink);margin:12%;visibility:hidden}
.die i.on{visibility:visible}
.die.roll{animation:shake .12s steps(2) infinite}
@keyframes shake{50%{transform:translate(1px,-2px) rotate(6deg)}}
.ctrl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px;min-height:34px;align-items:center}
.ctrl .q{width:100%;font-size:clamp(11px,3vw,14px)}
.thinking{color:var(--muted);font-size:clamp(11px,3vw,14px)}
.last{font-size:clamp(10px,2.7vw,13px);color:var(--muted);max-width:100%;min-height:2.6em;overflow:hidden}
.last b{color:var(--paper);font-weight:normal}

.card{position:absolute;inset:12%;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;
  box-shadow:0 0 0 3px var(--ink),5px 5px 0 3px var(--ink);animation:pop .25s steps(3)}
.card .k{background:var(--tomato);color:#fff;padding:2px 8px;font-size:13px}
.card.fate .k{background:var(--navy)}
.card p{margin:0;font-size:clamp(12px,3.6vw,17px)}
@keyframes pop{from{transform:scale(.4)}}

.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pl{background:#1d2747;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;box-shadow:0 0 0 2px var(--ink);min-width:0}
.pl img{width:26px;image-rendering:pixelated;grid-row:span 2}
.pl .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pl .m{font-variant-numeric:tabular-nums;color:var(--sun)}
.pl .tag{font-size:11px;color:var(--muted)}
.pl.now{box-shadow:0 0 0 2px var(--sun),4px 4px 0 2px var(--ink)}
.pl.out{opacity:.4}
.pl.out .m{text-decoration:line-through}

.panel{background:#1d2747;box-shadow:0 0 0 2px var(--ink);padding:10px 12px}
.panel h2{margin:0 0 6px;font-size:14px;font-weight:normal;color:var(--sun);letter-spacing:.1em}
.log{max-height:180px;overflow-y:auto;margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.log li:first-child{color:var(--paper)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;flex:none;box-shadow:0 0 0 1px var(--ink)}
.legend .tip{grid-column:1/-1}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.bar .act{display:flex;gap:10px}

.veil{position:fixed;inset:0;background:rgba(8,11,22,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.veil.mid{align-items:center}
.sheet{width:min(100%,520px);max-height:88%;overflow-y:auto;background:var(--night);border-top:3px solid var(--sun);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px}
.veil.mid .sheet{border:0;box-shadow:0 0 0 3px var(--sun),6px 6px 0 3px var(--ink);margin:16px;width:min(calc(100% - 32px),460px)}
.sheet h3{margin:0;font-size:20px;font-weight:normal;color:var(--sun);display:flex;align-items:center;gap:8px;line-height:1.3}
.sheet h3 .sw{width:14px;height:14px;flex:none;box-shadow:0 0 0 2px var(--ink)}
.sheet .sub{margin:-8px 0 0;color:var(--paper);font-size:14px}
.sheet .ing{margin:0;color:var(--muted);font-size:13px}
.sheet .ing span{display:block}
.rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.rows span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.rows .cur{color:var(--sun)}
.act{display:flex;flex-wrap:wrap;gap:10px}
.note{font-size:12px;color:var(--muted);margin:0}
.chili{color:var(--tomato);font-size:13px}
.setup-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.setup-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center}
.setup-row img{width:22px;image-rendering:pixelated}
.setup-row input{font-family:var(--px);font-size:15px;background:var(--paper);color:var(--ink);border:0;padding:6px 8px;min-width:0;width:100%;box-shadow:0 0 0 2px var(--ink)}
.seg{display:flex;box-shadow:0 0 0 2px var(--ink)}
.seg button{border:0;background:#2a3660;color:var(--muted);padding:6px 9px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--ink)}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.up-list{display:flex;flex-direction:column;gap:8px}
.up-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1d2747;padding:8px 10px}
.rank{display:flex;flex-direction:column;gap:6px}
.rank div{display:grid;grid-template-columns:28px 24px 1fr auto;gap:8px;align-items:center;background:#1d2747;padding:6px 10px;font-variant-numeric:tabular-nums}
.rank img{width:22px;image-rendering:pixelated}
.rank div:first-child{box-shadow:0 0 0 2px var(--sun)}
.rules{display:flex;flex-direction:column;gap:6px}
.rules details{background:#1d2747;box-shadow:0 0 0 2px var(--ink)}
.rules summary{cursor:pointer;padding:9px 12px;list-style:none;display:flex;justify-content:space-between;gap:10px;color:var(--paper)}
.rules summary::-webkit-details-marker{display:none}
.rules summary::after{content:'+';color:var(--sun)}
.rules details[open] summary::after{content:'−'}
.rules details[open] summary{color:var(--sun)}
.rules p{margin:0;padding:0 12px 12px;font-size:13.5px;line-height:1.7;color:var(--paper)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div class="wrap">
  <div class="board" id="board"></div>
  <div class="players" id="players"></div>
  <div class="panel"><h2 id="logTitle"></h2><ul class="log" id="log"></ul></div>
  <div class="panel"><div class="legend" id="legend"></div></div>
  <div class="bar"><span id="roundInfo"></span><div class="act"><button class="btn alt sm" id="rulesBtn"></button><button class="btn alt sm" id="langBtn"></button><button class="btn alt sm" id="newGame"></button></div></div>
</div>
<div id="overlay"></div>

<script>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let LANG='zh';
try{LANG=localStorage.getItem('jiushi-lang')||(/^zh/i.test(navigator.language)?'zh':'en')}catch(e){}

const TN=i=>LANG==='zh'?TILES[i].sz:TILES[i].se;
const stars=l=>'★'.repeat(l);
const TX={

const t=k=>TX[LANG][k];
const logText=e=>{try{return TX[LANG].log[e[0]](...e.slice(1))}catch(x){return ''}};

/* ===== Helpers ===== */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,80):ms));
const rnd=n=>Math.floor(Math.random()*n);
let S=null, cpuTimer=null, sheetFn=null;

const tokenCache={};
function tokenImg(color){
  if(tokenCache[color])return tokenCache[color];
  const map=["..y..y..","...y..y.","..y..y..","kkkkkkkk","kcccccck",".kcccck.","..kkkk..","...kk..."];
  const c=document.createElement('canvas');c.width=8;c.height=8;const x=c.getContext('2d');
  map.forEach((row,r)=>[...row].forEach((ch,col)=>{const f={y:'#ffffff',k:'#0d1222',c:color}[ch];if(f){x.fillStyle=f;x.fillRect(col,r,1,1)}}));
  return tokenCache[color]=c.toDataURL();
}
const cur=()=>S.players[S.turn];
const pidOf=p=>S.players.indexOf(p);
const alive=()=>S.players.filter(p=>!p.out);
const others=p=>S.players.filter(o=>o!==p&&!o.out);
const ownedBy=pid=>Object.keys(S.owner).map(Number).filter(i=>S.owner[i]===pid);
const groupTiles=g=>TILES.map((x,i)=>x.t==='p'&&x.g===g?i:-1).filter(i=>i>=0);
const ownsGroup=(pid,g)=>groupTiles(g).every(i=>S.owner[i]===pid);
const baseRent=i=>TILES[i].price;
const upCost=i=>TILES[i].price;
function rentOf(i){
  const x=TILES[i],o=S.owner[i],lv=S.level[i]||0,b=baseRent(i);
  if(lv>0)return b*LV_MULT[lv];
  return ownsGroup(o,x.g)?b*2:b;
}
const assets=pid=>{const p=S.players[pid];return p.money+ownedBy(pid).reduce((a,i)=>a+TILES[i].cost+(S.level[i]||0)*upCost(i),0)};
const canUpgrade=(pid,i)=>{const x=TILES[i];return x.t==='p'&&S.owner[i]===pid&&ownsGroup(pid,x.g)&&(S.level[i]||0)<3&&S.players[pid].money>=upCost(i)};
const upgradable=pid=>ownedBy(pid).filter(i=>canUpgrade(pid,i));
function log(...e){S.log.unshift(e);if(S.log.length>60)S.log.pop()}
function save(){try{if(S&&S.phase!=='over'&&!S.demo)localStorage.setItem('jiushi-monopoly-v4',JSON.stringify(S));else if(S&&S.phase==='over')localStorage.removeItem('jiushi-monopoly-v4')}catch(e){}}
function loadSaved(){try{const s=localStorage.getItem('jiushi-monopoly-v4');return s?JSON.parse(s):null}catch(e){return null}}

/* ===== Board ===== */
function cell(i){
  if(i<=7)return[8,8-i];
  if(i<=14)return[8-(i-7),1];
  if(i<=21)return[1,1+(i-14)];
  return[1+(i-21),8];
}
function buildBoard(){
  const b=$('#board');b.innerHTML='';
  TILES.forEach((x,i)=>{
    const d=document.createElement('div');
    const[r,c]=cell(i);d.style.gridRow=r;d.style.gridColumn=c;
    d.className='tile'+(CORNERS.includes(i)?' corner':x.t==='p'?'':' special')+(LANG==='en'?' en':'');
    d.id='t'+i;d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label',LANG==='zh'?(x.zh||x.sz):(x.en||x.se));
    const name=TN(i);
    let h;
    if(x.t==='p')h=`<div class="band" style="background:${GROUPS[x.g].c}"></div><div class="nm">${name}</div><div class="pr">$${x.cost}</div>`;
    else if(CORNERS.includes(i))h=`<div class="ic">${x.ic}</div><div class="nm">${name}</div><div class="pr">${t('cornerSub')[x.t]}</div>`;
    else h=`<div class="ic">${x.ic}</div><div class="nm">${name}</div>`;
    d.innerHTML=h+'<div class="lv"></div><div class="toks"></div><div class="own"></div>';
    d.onclick=()=>openTile(i);
    d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openTile(i)}};
    b.appendChild(d);
  });
  const c=document.createElement('div');c.className='center';c.id='center';b.appendChild(c);
  $('#legend').innerHTML=GROUPS.map((g,k)=>{const ps=groupTiles(k).map(i=>TILES[i].price);return `<span><i style="background:${g.c}"></i>${g[LANG]} · ${t('menu')} $${Math.min(...ps)}–${Math.max(...ps)}</span>`}).join('')+`<span class="tip">${t('tip')}</span>`;
  $('#logTitle').textContent=t('logTitle');$('#langBtn').textContent=t('langBtn');$('#rulesBtn').textContent=t('rulesBtn');$('#newGame').textContent=t('newGame');
  document.documentElement.lang=LANG==='zh'?'zh-Hant':'en';
}

/* ===== Render ===== */
function renderTiles(){
  TILES.forEach((x,i)=>{
    const el=$('#t'+i),o=S.owner[i];
    el.classList.toggle('owned',o!==undefined);
    if(o!==undefined)el.style.setProperty('--oc',S.players[o].color);
    el.querySelector('.lv').innerHTML='<i></i>'.repeat(S.level[i]||0);
    el.querySelector('.toks').innerHTML=S.players.filter(p=>!p.out&&p.pos===i).map(p=>`<img alt="" src="${tokenImg(p.color)}">`).join('');
  });
}
function renderPlayers(){
  $('#players').innerHTML=S.players.map((p,k)=>`
    <div class="pl${k===S.turn&&S.phase!=='over'?' now':''}${p.out?' out':''}">
      <img alt="" src="${tokenImg(p.color)}"><div class="n">${esc(p.name)}</div>
      <div><span class="m">$${p.money}</span> <span class="tag">${p.cpu?t('cpu'):t('human')}${p.jail?' · '+t('washing'):''}${p.card?' · '+t('ticket')(p.card):''}${p.out?' · '+t('broke'):''}</span></div>
    </div>`).join('');
  $('#log').innerHTML=S.log.map(e=>`<li>${logText(e)}</li>`).join('');
  $('#roundInfo').textContent=S.maxRounds?t('round')(Math.min(S.round,S.maxRounds),S.maxRounds):t('roundInf')(S.round);
}
function dieHTML(v,rolling){
  const on={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[v]||[];
  return `<div class="die${rolling?' roll':''}">${[...Array(9)].map((_,k)=>`<i class="${on.includes(k)?'on':''}"></i>`).join('')}</div>`;
}
function renderCenter(rolling){
  const p=cur(),c=$('#center');
  let ctrl='';
  if(S.phase==='over')ctrl=`<button class="btn" onclick="showOver()">${t('result')}</button>`;
  else if(p.cpu||S.phase==='busy')ctrl=`<span class="thinking">${p.cpu?t('thinking')(esc(p.name)):'…'}</span>`;
  else if(S.phase==='roll'){
    if(p.jail){
      ctrl=`<span class="q">${t('jailInfo')(p.jail)}</span><button class="btn" onclick="jailRoll()">${t('roll')}</button>
      <button class="btn alt" onclick="jailPay()" ${p.money<JAIL_FEE?'disabled':''}>${t('payOut')}</button>
      ${p.card?`<button class="btn alt" onclick="jailCard()">${t('useCard')}</button>`:''}`;
    }else ctrl=`<button class="btn" onclick="doRoll()">${t('roll')}</button>`;
    if(upgradable(S.turn).length)ctrl+=`<button class="btn alt" onclick="openUpgrades()">${t('boost')}</button>`;
  }
  else if(S.phase==='buy'){
    const i=p.pos;
    ctrl=`<span class="q">${t('buyQ')(TN(i),TILES[i].cost)}</span>
    <button class="btn" onclick="buy()">${t('buy')}</button><button class="btn alt" onclick="openTile(${i})">?</button><button class="btn alt" onclick="skipBuy()">${t('skip')}</button>`;
  }
  else if(S.phase==='post'){
    ctrl=S.again&&!p.out?`<button class="btn" onclick="reroll()">${t('again')}</button>`:`<button class="btn" onclick="endTurn()">${t('end')}</button>`;
    if(upgradable(S.turn).length)ctrl+=`<button class="btn alt" onclick="openUpgrades()">${t('boost')}</button>`;
  }
  const card=c.querySelector('.card');
  c.innerHTML=`
    <div class="logo">${t('logo')}<small>${t('logoSub')}</small></div>
    <div class="turn"><img alt="" src="${tokenImg(p.color)}">${t('turn')(esc(p.name))}</div>
    <div class="dice">${dieHTML(S.dice[0],rolling)}${dieHTML(S.dice[1],rolling)}</div>
    <div class="ctrl">${ctrl}</div>
    <div class="last">${S.log.slice(0,2).map((e,k)=>k?logText(e):`<b>${logText(e)}</b>`).join('<br>')}</div>`;
  if(card)c.appendChild(card);
}
function render(){renderTiles();renderPlayers();renderCenter();save();scheduleCpu()}

/* ===== Money ===== */
function pay(p,amt,to){p.money-=amt;if(to)to.money+=amt;if(p.money<0)liquidate(p)}
function liquidate(p){
  const pid=pidOf(p),mine=ownedBy(pid).sort((a,b)=>TILES[b].price-TILES[a].price);
  for(const i of mine)while((S.level[i]||0)>0&&p.money<0){S.level[i]--;p.money+=upCost(i)/2;log('sellUp',pid,i)}
  for(const i of mine)if(p.money<0){delete S.owner[i];S.level[i]=0;p.money+=TILES[i].cost/2;log('sellBack',pid,i)}
  if(p.money<0){p.out=true;p.money=0;ownedBy(pid).forEach(i=>{delete S.owner[i];S.level[i]=0});log('broke',pid)}
}

/* ===== Moves ===== */
async function moveSteps(p,n){
  const dir=n>0?1:-1;
  for(let k=0;k<Math.abs(n);k++){
    p.pos=(p.pos+dir+N_T)%N_T;
    if(dir>0&&p.pos===0){p.money+=GO_BONUS;log('passGo',pidOf(p))}
    renderTiles();renderPlayers();await sleep(160);
  }
  const el=$('#t'+p.pos);el.classList.remove('hot');void el.offsetWidth;el.classList.add('hot');
}
const moveTo=(p,to)=>moveSteps(p,(to-p.pos+N_T)%N_T);
function sendJail(p){p.pos=JAIL;p.jail=1;S.again=false;S.dbl=0;log('jailed',pidOf(p))}
async function showCard(type,ci){
  const deck=type==='chance'?CHANCE:FATE;
  const c=document.createElement('div');c.className='card'+(type==='fate'?' fate':'');
  c.innerHTML=`<span class="k">${t('kind')[type]}</span><p>${deck[ci][LANG]}</p>`;
  $('#center').appendChild(c);await sleep(1900);c.remove();
}
async function drawCard(p,type){
  const deck=type==='chance'?CHANCE:FATE,ci=rnd(deck.length),c=deck[ci];
  log('card',pidOf(p),type,ci);renderPlayers();
  await showCard(type,ci);
  if(c.jail){sendJail(p);return false}
  if(c.mv!==undefined){await moveTo(p,c.mv);await land(p);return true}
  if(c.back){await moveSteps(p,-c.back);await land(p);return true}
  c.fn(p);return false;
}
async function land(p){
  const i=p.pos,x=TILES[i],pid=pidOf(p);
  if(x.t==='p'){
    const o=S.owner[i];
    if(o===undefined){if(p.money>=x.cost){S.phase='buy';return}log('noCash',pid,i)}
    else if(o!==pid){if(!S.players[o].out){const r=rentOf(i);log('rent',pid,i,o,r);pay(p,r,S.players[o])}}
    else log('own',pid,i);
  }
  else if(x.t==='chance'||x.t==='fate'){if(await drawCard(p,x.t))return}
  else if(x.t==='gojail')sendJail(p);
  else if(x.t==='free')log('free',pid);
  else if(x.t==='jail')log('visit',pid);
  else if(x.t==='go')log('onGo',pid);
  S.phase='post';
}

/* ===== Actions ===== */
async function rollDice(){
  S.phase='busy';renderPlayers();
  for(let k=0;k<8;k++){S.dice=[1+rnd(6),1+rnd(6)];renderCenter(true);await sleep(60)}
  S.dice=[1+rnd(6),1+rnd(6)];renderCenter();return S.dice;
}
async function doRoll(){
  if(S.phase!=='roll'||S.demo&&openSetup())return;
  const p=cur(),[a,b]=await rollDice();
  log('roll',S.turn,a,b);
  if(a===b){S.dbl++;if(S.dbl>=3){log('triple');sendJail(p);S.phase='post';return finish()}S.again=true}else S.again=false;
  await moveSteps(p,a+b);await land(p);
  if(p.jail)S.again=false;
  finish();
}
async function jailRoll(){
  if(S.phase!=='roll')return;
  const p=cur(),[a,b]=await rollDice();
  log('jailRoll',S.turn,a,b);S.again=false;
  if(a===b){p.jail=0;log('jailOut',S.turn)}
  else if(p.jail>=3){p.jail=0;log('jailMax',S.turn);pay(p,JAIL_FEE)}
  else{p.jail++;S.phase='post';return finish()}
  if(p.out){S.phase='post';return finish()}
  await moveSteps(p,a+b);await land(p);finish();
}
function jailPay(){const p=cur();if(p.money<JAIL_FEE)return;pay(p,JAIL_FEE);p.jail=0;log('jailPay',S.turn);render()}
function jailCard(){const p=cur();if(!p.card)return;p.card--;p.jail=0;log('jailCard',S.turn);render()}
function buy(){
  if(S.phase!=='buy')return;
  const p=cur(),i=p.pos,x=TILES[i];
  pay(p,x.cost);S.owner[i]=S.turn;log('bought',S.turn,i);
  if(ownsGroup(S.turn,x.g))log('fullSet',S.turn);
  S.phase='post';closeSheet();render();
}
function skipBuy(){if(S.phase!=='buy')return;log('skip',S.turn,cur().pos);S.phase='post';closeSheet();render()}
function upgrade(i){
  if(!canUpgrade(S.turn,i))return;
  pay(cur(),upCost(i));S.level[i]=(S.level[i]||0)+1;
  log('boosted',S.turn,i,S.level[i],rentOf(i));render();
}
function reroll(){S.phase='roll';render()}
function finish(){
  if(alive().length<=1)return gameOver();
  if(cur().out){S.phase='post';S.again=false}
  render();
}
function endTurn(){
  if(S.phase!=='post')return;
  closeSheet();S.dbl=0;S.again=false;
  let k=S.turn;
  do{k=(k+1)%S.players.length;if(k===0)S.round++}while(S.players[k].out);
  S.turn=k;
  if(S.maxRounds&&S.round>S.maxRounds)return gameOver();
  S.phase='roll';render();
}
const ranking=()=>S.players.map((p,k)=>({p,k,a:p.out?-1:assets(k)})).sort((x,y)=>y.a-x.a);
function gameOver(){S.phase='over';log('win',ranking()[0].k);render();showOver()}

/* ===== CPU ===== */
function scheduleCpu(){
  clearTimeout(cpuTimer);
  if(!S||S.demo||S.phase==='over'||S.phase==='busy'||!cur().cpu)return;
  cpuTimer=setTimeout(cpuAct,750);
}
function cpuAct(){
  const p=cur();if(!p.cpu)return;
  if(S.phase==='roll'){if(p.jail){if(p.card)return jailCard();if(p.money>400)return jailPay();return jailRoll()}return doRoll()}
  if(S.phase==='buy')return p.money-TILES[p.pos].cost>=200?buy():skipBuy();
  if(S.phase==='post'){
    const up=upgradable(S.turn).sort((a,b)=>TILES[b].price-TILES[a].price).find(i=>p.money-upCost(i)>=300);
    if(up!==undefined)return upgrade(up);
    return S.again?reroll():endTurn();
  }
}

/* ===== Sheets ===== */
function sheet(fn,mid){sheetFn=[fn,mid];$('#overlay').innerHTML=`<div class="veil${mid?' mid':''}" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog">${fn()}</div></div>`}
function closeSheet(){sheetFn=null;$('#overlay').innerHTML=''}
function openTile(i){
  if(!S)return;
  sheet(()=>{
    const x=TILES[i],o=S.owner[i];let h;
    if(x.t==='p'){
      const b=baseRent(i),lv=S.level[i]||0,full=o!==undefined&&ownsGroup(o,x.g);
      const main=LANG==='zh'?x.zh:x.en,second=LANG==='zh'?x.en:x.zh;
      h=`<h3><span class="sw" style="background:${GROUPS[x.g].c}"></span>${main}</h3>
      <p class="sub">${second}${x.spicy?` <span class="chili">${t('spicy')}</span>`:''}</p>
      ${x.iz?`<p class="ing"><span>${LANG==='zh'?x.iz:x.ie}</span><span>${LANG==='zh'?x.ie:x.iz}</span></p>`:''}
      <div class="rows">
        <span>${t('price')}</span><span>$${x.cost}</span>
        <span class="${o!==undefined&&!full&&!lv?'cur':''}">${t('baseRent')}</span><span>$${b}</span>
        <span class="${full&&!lv?'cur':''}">${t('fullSet')}</span><span>$${b*2}</span>
        ${[1,2,3].map(l=>`<span class="${lv===l?'cur':''}">${t('star')(l)}</span><span>$${b*LV_MULT[l]}</span>`).join('')}
        <span>${t('boostCost')}</span><span>$${upCost(i)}</span>
        <span>${t('owner')}</span><span>${o!==undefined?esc(S.players[o].name):t('noOwner')}</span>
      </div>`;
      if(!S.demo&&o===S.turn&&!cur().cpu&&(S.phase==='roll'||S.phase==='post')){
        h+=canUpgrade(S.turn,i)?`<div class="act"><button class="btn" onclick="upgrade(${i});openTile(${i})">${t('boostBtn')(upCost(i))}</button></div>`
          :`<p class="note">${lv>=3?t('maxed'):!ownsGroup(S.turn,x.g)?t('needSet'):t('noMoney')}</p>`;
      }
      if(S.phase==='buy'&&cur().pos===i&&!cur().cpu)h+=`<div class="act"><button class="btn" onclick="buy()">${t('buy')} $${x.cost}</button><button class="btn alt" onclick="skipBuy()">${t('skip')}</button></div>`;
    }else{
      h=`<h3>${x.ic} ${TN(i)}</h3><p class="sub">${LANG==='zh'?x.se:x.sz}</p><p class="note" style="font-size:14px">${t('desc')[x.t]}</p>`;
    }
    return h+`<div class="act"><button class="btn alt" onclick="closeSheet()">${t('close')}</button></div>`;
  });
}
function openUpgrades(){
  sheet(()=>{
    const list=ownedBy(S.turn).filter(i=>ownsGroup(S.turn,TILES[i].g));
    return `<h3>${t('boostTitle')}</h3><p class="note">${t('boostNote')(cur().money)}</p>
    <div class="up-list">${list.map(i=>`<div class="up-item"><span>${TN(i)} · ${stars(S.level[i]||0)||t('plain')} · ${t('rentNow')(rentOf(i))}</span>
      ${canUpgrade(S.turn,i)?`<button class="btn" onclick="upgrade(${i});openUpgrades()">+ $${upCost(i)}</button>`:`<span class="note">${(S.level[i]||0)>=3?'★★★':t('noMoney')}</span>`}</div>`).join('')}</div>
    <div class="act"><button class="btn alt" onclick="closeSheet()">${t('done')}</button></div>`;
  });
}
function showOver(){
  sheet(()=>{const r=ranking();return `<h3>🏆 ${t('winner')(esc(r[0].p.name))}</h3><p class="note">${t('rankNote')}</p>
  <div class="rank">${r.map((x,n)=>`<div><span>${n+1}</span><img alt="" src="${tokenImg(x.p.color)}"><span>${esc(x.p.name)}</span><span>${x.a<0?t('broke'):'$'+x.a}</span></div>`).join('')}</div>
  <div class="act"><button class="btn" onclick="openSetup()">${t('playAgain')}</button><button class="btn alt" onclick="closeSheet()">${t('viewBoard')}</button></div>`},true);
}

function openRules(fromSetup){
  sheet(()=>`<h3>📖 ${t('rulesTitle')}</h3>
    <div class="rules">${t('rules').map(([h,b],k)=>`<details${k===0?' open':''}><summary>${h}</summary><p>${b}</p></details>`).join('')}</div>
    <div class="act">${fromSetup?`<button class="btn" onclick="openSetup()">${t('back')}</button>`:''}<button class="btn alt" onclick="closeSheet()">${t('close')}</button></div>`,true);
}

/* ===== Setup ===== */
const setup={count:3,rounds:15,players:[{name:null,cpu:false},{name:null,cpu:true},{name:null,cpu:true},{name:null,cpu:true}]};
const setupName=k=>setup.players[k].name??t('defNames')[k];
function openSetup(){
  sheet(()=>{
    const saved=loadSaved();
    const segP=[2,3,4].map(n=>`<button aria-pressed="${setup.count===n}" onclick="setup.count=${n};openSetup()">${t('pplN')(n)}</button>`).join('');
    const segR=[10,15,25,0].map(v=>`<button aria-pressed="${setup.rounds===v}" onclick="setup.rounds=${v};openSetup()">${v?t('rN')(v):t('unlimited')}</button>`).join('');
    const rows=setup.players.slice(0,setup.count).map((p,k)=>`
      <div class="setup-row"><img alt="" src="${tokenImg(COLORS[k])}">
        <input id="pn${k}" value="${esc(setupName(k))}" maxlength="12" aria-label="${t('nameLabel')(k+1)}" oninput="setup.players[${k}].name=this.value">
        <div class="seg"><button aria-pressed="${!p.cpu}" onclick="setup.players[${k}].cpu=false;openSetup()">${t('human')}</button><button aria-pressed="${p.cpu}" onclick="setup.players[${k}].cpu=true;openSetup()">${t('cpu')}</button></div>
      </div>`).join('');
    return `<div class="setup-head"><h3>${t('logo')}</h3><div class="act"><button class="btn alt sm" onclick="openRules(true)">${t('rulesBtn')}</button><button class="btn alt sm" onclick="toggleLang()">${t('langBtn')}</button></div></div>
      <p class="note" style="font-size:13px">${t('intro')}</p>
      <div class="field"><span>${t('players')}</span><div class="seg">${segP}</div></div>
      ${rows}
      <div class="field"><span>${t('rounds')}</span><div class="seg">${segR}</div></div>
      <div class="act"><button class="btn" onclick="startGame()">${t('start')}</button>
      ${saved&&saved.phase!=='over'?`<button class="btn alt" onclick="resume()">${t('resume')}</button>`:''}</div>`;
  },true);
  return true;
}
function startGame(){
  S={players:setup.players.slice(0,setup.count).map((p,k)=>({name:(setupName(k)||'').trim()||t('defNames')[0].replace('1',k+1),cpu:p.cpu,color:COLORS[k],money:START_MONEY,pos:0,jail:0,card:0,out:false})),
    owner:{},level:{},turn:0,round:1,maxRounds:setup.rounds,phase:'roll',dice:[3,4],dbl:0,again:false,log:[]};
  log('start',START_MONEY);closeSheet();render();
}
function resume(){const s=loadSaved();if(!s)return;S=s;if(S.phase==='busy')S.phase=S.again?'roll':'post';closeSheet();render()}
function toggleLang(){
  LANG=LANG==='zh'?'en':'zh';
  try{localStorage.setItem('jiushi-lang',LANG)}catch(e){}
  buildBoard();renderTiles();renderPlayers();renderCenter();
  if(sheetFn)sheet(sheetFn[0],sheetFn[1]);
}

/* ===== Boot ===== */
$('#newGame').onclick=openSetup;
$('#langBtn').onclick=toggleLang;
$('#rulesBtn').onclick=()=>openRules(false);
function boot(d){
  buildBoard();
  if(d&&d.S&&d.S.players){S=d.S;if(S.phase==='busy')S.phase='post';render();return}
  S={demo:true,players:[0,1,2].map(k=>({name:t('defNames')[k],cpu:k>0,color:COLORS[k],money:START_MONEY,pos:0,jail:0,card:0,out:false})),
    owner:{},level:{},turn:0,round:1,maxRounds:15,phase:'roll',dice:[3,4],dbl:0,again:false,log:[['hint']]};
  renderTiles();renderPlayers();renderCenter();openSetup();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>

</body></html>
