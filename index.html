<title>拌麵出餐挑戰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one phone screen. Order slip on top, plating stage in the middle, ingredient tray at thumb reach. Single paper-and-ink look taken from the 久時 menu. */
:root{
  --paper:#f1f2ee; --paper-2:#e6e9e4; --card:#fbfbf8;
  --ink:#23314a; --ink-soft:#5d6b82;
  --brand:#405880; --brand-deep:#2f4466; --brand-soft:#d3dbe8; --line:#bcc6d5;
  --bad:#b4523c; --good:#4d7a52; --gold:#c39638;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(circle at 20% 10%,rgba(64,88,128,.06),transparent 40%),radial-gradient(circle at 90% 80%,rgba(64,88,128,.07),transparent 45%)}
.app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;gap:8px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.screen{display:flex;flex-direction:column;flex:1;min-height:0;gap:8px}

/* ---------- start ---------- */
.brandline{font-family:var(--f-display);color:var(--brand);letter-spacing:.5em;font-size:13px;text-align:center;margin-top:6px}
.brandline b{font-weight:500;color:var(--line);letter-spacing:0;margin:0 .4em}
.hero{display:flex;justify-content:center}
.hero svg{width:min(58vw,240px,34vh);height:auto}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,9vw,40px);text-align:center;margin:0;letter-spacing:.12em;color:var(--brand-deep);text-wrap:balance}
.sub{text-align:center;color:var(--ink-soft);margin:0;font-size:14px;line-height:1.6}
.how{list-style:none;padding:0;margin:4px auto 0;display:grid;gap:6px;font-size:13.5px;max-width:330px;width:100%}
.how li{display:grid;grid-template-columns:26px 1fr;align-items:center;gap:8px;color:var(--ink)}
.how span{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--brand);color:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px}
.toggles{display:flex;justify-content:center;gap:10px;margin-top:4px}
.seg{display:flex;border:1.5px solid var(--brand);border-radius:999px;overflow:hidden}
.seg button{padding:6px 14px;font-size:13px;color:var(--brand)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.primary{margin:8px auto 0;background:var(--brand);color:#fff;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.3em;padding:14px 0;width:min(100%,320px);border-radius:12px;box-shadow:0 4px 0 var(--brand-deep)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-deep)}
.best{text-align:center;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.spacer{flex:1}

/* ---------- HUD ---------- */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;font-variant-numeric:tabular-nums}
.hud .lbl{font-size:10.5px;letter-spacing:.15em;color:var(--ink-soft)}
.hud .val{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--brand-deep);line-height:1.1}
.hud .r{text-align:right}
.clock{text-align:center}
.clock .val{font-size:26px}
.clock.low .val{color:var(--bad)}
.timebar{height:4px;background:var(--paper-2);border-radius:4px;overflow:hidden}
.timebar i{display:block;height:100%;background:var(--brand);transform-origin:left;width:100%}
.combo{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.05em;min-height:14px}

/* ---------- ticket ---------- */
.ticket{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px 12px 10px;position:relative;box-shadow:0 2px 0 rgba(35,49,74,.06)}
.ticket::before,.ticket::after{content:"";position:absolute;left:10px;right:10px;height:6px;background:radial-gradient(circle at 4px 0,transparent 3px,var(--card) 3.5px) repeat-x;background-size:8px 6px}
.ticket::before{top:-6px;transform:scaleY(-1)}
.ticket::after{bottom:-6px}
.t-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.t-name{font-family:var(--f-display);font-weight:700;font-size:clamp(17px,5vw,20px);margin:2px 0 6px;color:var(--ink);line-height:1.3}
.t-name small{font-family:var(--f-ui);font-weight:500;font-size:11px;color:var(--bad);border:1px solid var(--bad);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:3px;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:22px}
.chip{font-size:11.5px;padding:2px 7px;border-radius:999px;border:1px dashed var(--line);color:var(--ink-soft);line-height:1.4}
.chip.done{border-style:solid;border-color:var(--good);color:var(--good);background:rgba(77,122,82,.08)}
.chip.done::before{content:"✓ "}
.chip.base{border-color:var(--brand);color:var(--brand)}
.chip.base.done{border-color:var(--good);color:var(--good)}
.t-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.t-bar{flex:1;height:5px;border-radius:5px;background:var(--paper-2);overflow:hidden}
.t-bar i{display:block;height:100%;background:var(--good);width:100%}
.t-bar.warn i{background:var(--bad)}
.hintbtn{font-size:11.5px;color:var(--brand);border:1px solid var(--brand);border-radius:999px;padding:2px 9px;white-space:nowrap}
.hintbtn[disabled]{opacity:.35;cursor:default}

/* ---------- stage ---------- */
.stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.stage svg{width:auto;height:100%;max-height:250px;max-width:100%}
.cooking{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.cooking div{background:rgba(35,49,74,.82);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;display:flex;align-items:center;gap:8px}
.cooking .ring{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:var(--bad);color:#fff;font-size:13px;padding:5px 12px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;z-index:3}
.toast.show{opacity:1}
.toast.ok{background:var(--good)}
.float{position:absolute;left:50%;top:40%;transform:translate(-50%,0);font-family:var(--f-display);font-weight:900;font-size:30px;color:var(--brand-deep);pointer-events:none;animation:rise .9s ease-out forwards;z-index:3;text-shadow:0 2px 0 var(--paper)}
@keyframes rise{to{transform:translate(-50%,-60px);opacity:0}}

/* ---------- tray ---------- */
.trayhead{display:flex;justify-content:space-between;align-items:baseline}
.step{font-family:var(--f-display);font-weight:700;color:var(--brand);font-size:14px;letter-spacing:.15em}
.step b{color:var(--line);font-weight:500;letter-spacing:0;margin:0 .3em}
.stepnote{font-size:11.5px;color:var(--ink-soft)}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 3px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:0;transition:transform .08s}
.tile svg{width:clamp(34px,10vw,44px);height:auto}
.tile span{font-size:clamp(10px,2.9vw,11.5px);line-height:1.25;text-align:center;color:var(--ink);word-break:break-all}
.tile:active{transform:scale(.95)}
.tile.used{opacity:.35}
.tile[disabled]{opacity:.35;cursor:default}
.tile.shake{animation:shake .32s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.serve{margin-top:4px;width:100%;padding:12px 0;border-radius:12px;font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.35em;background:var(--paper-2);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:8px}
.serve.ready{background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-deep);animation:pulse 1s infinite}
.serve.ready:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-deep)}
@keyframes pulse{50%{filter:brightness(1.15)}}

/* ---------- result ---------- */
.result{align-items:center;text-align:center;justify-content:center;gap:10px}
.rank{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,9vw,38px);color:var(--brand-deep);letter-spacing:.1em;margin:0}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:36px;height:36px}
.bigscore{font-family:var(--f-display);font-weight:900;font-size:48px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;width:100%;max-width:340px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.stats div+div{border-left:1px dotted var(--line)}
.stats b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--brand-deep)}
.stats span{font-size:11px;color:var(--ink-soft);letter-spacing:.1em}
.receipt{font-size:13px;color:var(--ink-soft);max-width:320px;line-height:1.6}
.newbest{color:var(--gold);font-weight:700;font-size:13px;letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app"></div>

(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
let uid=0;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,p){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(p<0?v*(1+p):v+(255-v)*p)));return'#'+[n>>16,n>>8&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('')}
function shuffle(a,r=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const f1=v=>v.toFixed(1);
function strands(r,o){
  const {n,len,amp,freq,w,color,area,cx=0,cy=0,curl=0,steps=14}=o;const dark=o.dark||shade(color,-.32);
  let under='',over='';
  for(let i=0;i<n;i++){
    const a=r()*Math.PI*2,d=Math.sqrt(r())*area;let x=cx+Math.cos(a)*d-len/2*Math.cos(a+1),y=cy+Math.sin(a)*d-len/2*Math.sin(a+1);let th=r()*Math.PI*2;
    const pts=[[x,y]];
    for(let s=1;s<=steps;s++){th+=curl*(r()-.5);x+=Math.cos(th)*len/steps;y+=Math.sin(th)*len/steps;const off=amp*Math.sin(freq*s+i*1.3);pts.push([x-Math.sin(th)*off,y+Math.cos(th)*off])}
    const d2='M'+pts.map(p=>f1(p[0])+' '+f1(p[1])).join(' L');
    under+=`<path d="${d2}" stroke="${dark}" stroke-width="${f1(w+1.6)}"/>`;over+=`<path d="${d2}" stroke="${color}" stroke-width="${f1(w)}"/>`;
  }
  return `<g fill="none" stroke-linecap="round" stroke-linejoin="round">${under}${over}</g>`;
}
function dots(r,n,area,cx,cy,fn){let s='';for(let i=0;i<n;i++){const a=r()*Math.PI*2,d=Math.sqrt(r())*area;s+=fn(cx+Math.cos(a)*d,cy+Math.sin(a)*d,r,i)}return s}

function icon(id,size){return `<svg viewBox="0 0 40 40" width="${size||44}" height="${size||44}" aria-hidden="true">${IC[id]||""}</svg>`}
function noodleSwatch(b){const s=NOODLE_STYLE[BASES[b].style],c=BASES[b].color,id="sw"+(++uid);
  return `<svg viewBox="0 0 40 40" aria-hidden="true"><defs><clipPath id="${id}"><circle cx="20" cy="20" r="17"/></clipPath></defs><circle cx="20" cy="20" r="18" fill="#f3efe4" stroke="#bcc6d5"/><g clip-path="url(#${id})">${strands(rng(b.length*31),{n:Math.round(s.n*.35),len:s.len*.38,amp:s.amp*.45,freq:s.freq,w:s.w*.5,curl:s.curl,color:c,area:13,cx:20,cy:20,steps:10})}</g></svg>`}
function baseIcon(b){return NOODLE_BASES.includes(b)?noodleSwatch(b):icon(b)}
function place(id,x,y,s,rot){return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${rot||0}) scale(${s}) translate(-20 -20)">${IC[id]}</g>`}

const SLOTS=[[0,-46],[-48,4],[46,12],[-4,48],[-34,-34],[38,-32]];
function drawBowl(d,st){
  const b=d.bowl,cid="nc"+(++uid);let s=`<circle cx="120" cy="126" r="112" fill="rgba(35,49,74,.13)"/><circle cx="120" cy="120" r="112" fill="${b.rim}"/>`;
  if(b.deco==="thin"){s+=`<circle cx="120" cy="120" r="108" fill="${b.inner}"/>`}
  else{s+=`<circle cx="120" cy="120" r="99" fill="${b.inner}"/>`}
  const r=rng(d.id.charCodeAt(1)*97);
  if(b.deco==="speckle")s+=dots(r,140,104,120,120,(x,y)=>Math.hypot(x-120,y-120)>80?`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(1+r()*1.6)}" fill="${shade(b.inner,-.22)}" opacity=".7"/>`:"");
  if(b.deco==="waves"){for(let i=0;i<5;i++){s+=`<path d="M${40+i*8} ${150+i*6} Q120 ${92+i*10} ${200-i*8} ${150+i*6}" stroke="#2f4f8a" stroke-width="2.2" fill="none" opacity=".75"/>`}s+=dots(r,70,98,120,120,(x,y)=>`<circle cx="${f1(x)}" cy="${f1(y)}" r="1.4" fill="#5f7fb0" opacity=".5"/>`)}
  if(b.deco==="stripes"){for(let i=0;i<48;i++){const a=i/48*Math.PI*2;s+=`<line x1="${f1(120+Math.cos(a)*76)}" y1="${f1(120+Math.sin(a)*76)}" x2="${f1(120+Math.cos(a)*98)}" y2="${f1(120+Math.sin(a)*98)}" stroke="#6e7178" stroke-width="1"/>`}}
  s+=`<defs><clipPath id="${cid}"><circle cx="120" cy="120" r="74"/></clipPath></defs>`;
  if(st.base){const ns=NOODLE_STYLE[BASES[d.base].style];s+=`<g clip-path="url(#${cid})">${strands(rng(7+d.id.charCodeAt(1)),{...ns,color:d.sauce,area:58,cx:120,cy:120})}</g>`}
  const added=st.added||[];
  d.items.forEach((it,i)=>{
    if(!added.includes(it))return;
    if(d.ring&&d.ring.includes(it)){const off=d.ring.indexOf(it)*22.5;for(let k=0;k<8;k++){const a=(k*45+off)*Math.PI/180;s+=place(it,120+Math.cos(a)*78,120+Math.sin(a)*78,1.05,k*45+off+90)}return}
    if(d.center&&d.center.includes(it)){s+=place(it,120,120,it==="karasumi"?1.7:1.5,0);return}
    const [x,y]=SLOTS[i%SLOTS.length];s+=place(it,120+x,120+y,1.45,(i*37)%30-15);
  });
  return s;
}

function mistake(el,msg){

   <p class="rank">${L().ranks[rank]}</p>
   <div class="bigscore">${s.toLocaleString()}</div>
   ${isBest?`<div class="newbest">${L().newBest}</div>`:""}
   <div class="stats"><div><b>${G.served}</b><span>${L().served}</span></div><div><b>${G.missed}</b><span>${L().missed}</span></div><div><b>${acc}%</b><span>${L().acc}</span></div></div>
   <p class="receipt">${L().receipt(G.served,G.revenue)}</p>
   <button class="primary" id="again">${L().again}</button>
   <button class="seg" id="home" style="margin:0 auto;padding:6px 18px;color:var(--brand);font-size:13px">${L().home}</button>
  </div>`;
  G=null;
  $("#again").onclick=startGame;$("#home").onclick=startScreen;
}
startScreen();
})();
</script>
